name: Android CI and Release

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify and build debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version_name: ${{ steps.apk_metadata.outputs.version_name }}
      version_code: ${{ steps.apk_metadata.outputs.version_code }}

    steps:
      # Checkout v7 is the current supported major.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check responsive layout profiles
        run: python3 tools/check_layout_profiles.py

      # setup-java v6 provisions the JDK required by AGP 8.6.
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # setup-android v4 provisions command-line tools, licenses, and the requested platform.
      - name: Set up Android SDK and accept licenses
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "15859902"
          accept-android-sdk-licenses: "true"
          packages: "platforms;android-35"

      # Gradle setup v6 installs the exact Gradle version; basic uses the open-source cache.
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

      # The project hard-codes this debug keystore path. This key is intentionally ephemeral.
      - name: Create ephemeral debug signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-signing
          keytool -genkeypair -noprompt \
            -keystore ci-signing/fcmguard-debug.keystore \
            -storetype JKS \
            -storepass android \
            -keypass android \
            -alias fcmguarddebug \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=FCM Guard CI Debug,O=CI"

      - name: Run tests, lint, and assemble APKs
        run: >-
          gradle --no-daemon --stacktrace
          :app:testDebugUnitTest
          :app:lintDebug
          :app:assembleDebug
          :app:assembleDebugAndroidTest

      - name: Read version from APK metadata
        id: apk_metadata
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import re

          with open("app/build/outputs/apk/debug/output-metadata.json", encoding="utf-8") as file:
              metadata = json.load(file)

          elements = metadata.get("elements", [])
          if len(elements) != 1:
              raise SystemExit(f"Expected one debug APK, got {len(elements)}")

          version_name = str(elements[0].get("versionName", ""))
          version_code = str(elements[0].get("versionCode", ""))

          if not re.fullmatch(r"[0-9][A-Za-z0-9._-]*", version_name):
              raise SystemExit(f"Unsupported versionName for release tags: {version_name!r}")
          if not version_code.isdigit():
              raise SystemExit(f"Invalid versionCode: {version_code!r}")

          print(f"version_name={version_name}")
          print(f"version_code={version_code}")
          PY

      # upload-artifact v7 stores the build output; no signing key is uploaded.
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: FCMGuard-debug-${{ steps.apk_metadata.outputs.version_name }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-ci-diagnostics-${{ github.run_id }}
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7

  release_gate:
    name: Check whether this main commit needs a release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
      tag: ${{ steps.gate.outputs.tag }}
      version_name: ${{ needs.verify.outputs.version_name }}

    steps:
      - name: Decide release from version metadata
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ needs.verify.outputs.version_name }}
        run: |
          set -euo pipefail
          TAG="v${VERSION_NAME}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${TAG} already exists; bump versionName to publish another release."
            exit 0
          fi

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Git tag ${TAG} exists without a GitHub Release; recover it manually."
            exit 1
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"
